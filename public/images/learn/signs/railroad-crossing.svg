<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="rc-t rc-d">
  <title id="rc-t">Railroad crossing ahead (207-B)</title>
  <desc id="rc-d">Original educational Japanese warning sign for 踏切あり (207-B): yellow diamond with a black electric-train pictogram, pantograph, cab and passenger windows, and bogies. Distinct from 207-A steam locomotive. Geometry matched to the official 別表第二 / MLIT 207-B figure; not an official reproduction.</desc>
  <polygon points="100,40 160,100 100,160 40,100" fill="#F7D117" stroke="#252A2D" stroke-width="4.5" stroke-linejoin="round"/>
  <g fill="#252A2D">
    <!-- Pantograph above cab (left) -->
    <polygon points="72,78 84,66 96,78"/>
    <rect x="82" y="78" width="4" height="6"/>
    <!-- Car body -->
    <path d="M64 86h70a7 7 0 0 1 7 7v24a5 5 0 0 1-5 5H64a5 5 0 0 1-5-5V93a7 7 0 0 1 7-7z"/>
    <!-- Track / skirt -->
    <rect x="56" y="122" width="88" height="5" rx="1"/>
    <!-- Bogies -->
    <path d="M68 127c0 0 2 8 12 8s12-8 12-8H68z"/>
    <path d="M108 127c0 0 2 8 12 8s12-8 12-8h-24z"/>
  </g>
  <g fill="#F7D117">
    <!-- Cab windshield (front/left) -->
    <rect x="61" y="91" width="11" height="18" rx="1.5"/>
    <!-- Door window near cab -->
    <rect x="76" y="91" width="7" height="11" rx="1"/>
    <!-- Passenger windows -->
    <rect x="87" y="93" width="8" height="10" rx="1"/>
    <rect x="98" y="93" width="8" height="10" rx="1"/>
    <rect x="109" y="93" width="8" height="10" rx="1"/>
    <rect x="120" y="93" width="8" height="10" rx="1"/>
    <!-- Rear door window -->
    <rect x="132" y="91" width="7" height="11" rx="1"/>
  </g>
</svg>
