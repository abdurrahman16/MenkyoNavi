<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="h-t h-d">
  <title id="h-t">日本の道路標識</title>
  <desc id="h-d">Educational collage of Japanese temporary-stop, vehicle no-entry, maximum-speed, and crossroads warning signs on a washi background.</desc>
  <rect width="720" height="360" fill="#F7F3E9"/>
  <rect x="0" y="0" width="720" height="8" fill="#26466D"/>
  <text x="36" y="48" fill="#172D46" font-family="Georgia,serif" font-size="26" font-weight="700">日本の道路標識を学ぶ</text>
  <!-- Temporary stop (inverted triangle) -->
  <g transform="translate(48,78) scale(0.95)">
    <polygon points="100,178 22,34 178,34" fill="#C62828" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <text x="100" y="98" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700">止まれ</text>
  </g>
  <!-- Vehicle no entry 303 -->
  <g transform="translate(230,95) scale(0.85)">
    <circle cx="100" cy="100" r="78" fill="#C62828"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="38" y="88" width="124" height="24" fill="#FFFFFF"/>
  </g>
  <!-- Maximum speed 40 -->
  <g transform="translate(400,95) scale(0.85)">
    <circle cx="100" cy="100" r="78" fill="#FFFFFF" stroke="#C62828" stroke-width="14"/>
    <text x="100" y="118" text-anchor="middle" fill="#252A2D" font-family="sans-serif" font-size="64" font-weight="700">40</text>
  </g>
  <!-- Crossroads warning -->
  <g transform="translate(560,95) scale(0.85)">
    <polygon points="100,40 160,100 100,160 40,100" fill="#F7D117" stroke="#252A2D" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="93" y="70" width="14" height="60" rx="2" fill="#252A2D"/>
    <rect x="70" y="93" width="60" height="14" rx="2" fill="#252A2D"/>
  </g>
</svg>
