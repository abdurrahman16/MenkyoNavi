<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="ipc-t ipc-d">
  <title id="ipc-t">Intersection priority comparison</title>
  <desc id="ipc-d">Three language-neutral panels: signal control, priority road, and left-side approach. Captions rendered in HTML.</desc>
  <defs>
    <marker id="ipc-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C6533E"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#F7F3E9"/>
  <g transform="translate(30,40)">
    <rect width="280" height="320" rx="18" fill="#FFFFFF" stroke="#26466D" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#26466D"/>
    <text x="40" y="46" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">1</text>
    <circle cx="90" cy="120" r="14" fill="#C6533E"/>
    <circle cx="90" cy="160" r="14" fill="#B88A44"/>
    <circle cx="90" cy="200" r="14" fill="#71865A"/>
    <rect x="40" y="240" width="200" height="60" fill="#D9D3C5"/>
    <rect x="110" y="210" width="60" height="120" fill="#D9D3C5"/>
  </g>
  <g transform="translate(340,40)">
    <rect width="280" height="320" rx="18" fill="#FFFFFF" stroke="#26466D" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#26466D"/>
    <text x="40" y="46" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">2</text>
    <polygon points="140,90 190,140 140,190 90,140" fill="#F7D117" stroke="#252A2D" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="140,112 168,140 140,168 112,140" fill="#FFFFFF" stroke="#252A2D" stroke-width="2" stroke-linejoin="round"/>
    <rect x="50" y="220" width="180" height="50" fill="#26466D"/>
    <rect x="105" y="200" width="70" height="110" fill="#D9D3C5"/>
  </g>
  <g transform="translate(650,40)">
    <rect width="280" height="320" rx="18" fill="#FFFFFF" stroke="#26466D" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#26466D"/>
    <text x="40" y="46" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" font-family="sans-serif">3</text>
    <rect x="40" y="140" width="200" height="50" fill="#D9D3C5"/>
    <rect x="105" y="90" width="70" height="180" fill="#D9D3C5"/>
    <path d="M70 250 L140 170" stroke="#C6533E" stroke-width="4" fill="none" marker-end="url(#ipc-arrow)"/>
  </g>
</svg>
