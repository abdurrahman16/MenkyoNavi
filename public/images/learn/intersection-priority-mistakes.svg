<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="ipm-t ipm-d">
  <title id="ipm-t">Incorrect versus safe stop approach</title>
  <desc id="ipm-d">Language-neutral side-by-side comparison: rolling through a stop versus a complete stop. Captions rendered in HTML.</desc>
  <rect width="960" height="400" fill="#F7F3E9"/>
  <g transform="translate(40,30)">
    <rect width="420" height="340" rx="18" fill="#FFFFFF" stroke="#C6533E" stroke-width="3"/>
    <circle cx="40" cy="40" r="18" fill="#C6533E"/>
    <path d="M32 32 L48 48 M48 32 L32 48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="40" y="150" width="340" height="60" fill="#D9D3C5"/>
    <rect x="280" y="140" width="80" height="10" fill="#C6533E"/>
    <g transform="translate(200,155)">
      <rect width="70" height="28" rx="5" fill="#C6533E"/>
      <circle cx="16" cy="30" r="6" fill="#252A2D"/>
      <circle cx="54" cy="30" r="6" fill="#252A2D"/>
    </g>
    <path d="M170 185 h120" stroke="#C6533E" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  </g>
  <g transform="translate(500,30)">
    <rect width="420" height="340" rx="18" fill="#FFFFFF" stroke="#71865A" stroke-width="3"/>
    <circle cx="40" cy="40" r="18" fill="#71865A"/>
    <path d="M30 40 L38 48 L52 30" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="150" width="340" height="60" fill="#D9D3C5"/>
    <rect x="280" y="140" width="80" height="10" fill="#C6533E"/>
    <g transform="translate(140,155)">
      <rect width="70" height="28" rx="5" fill="#26466D"/>
      <circle cx="16" cy="30" r="6" fill="#252A2D"/>
      <circle cx="54" cy="30" r="6" fill="#252A2D"/>
    </g>
    <circle cx="210" cy="250" r="8" fill="none" stroke="#B88A44" stroke-width="3"/>
    <circle cx="240" cy="250" r="8" fill="none" stroke="#B88A44" stroke-width="3"/>
    <circle cx="270" cy="250" r="8" fill="none" stroke="#B88A44" stroke-width="3"/>
  </g>
